[project]
name = "evals-rag-juridique-fr"
version = "0.1.0"
description = "Harness d'évaluation RAG sur le Code de la consommation (français)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Nicolas Merli" }]
dependencies = [
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0.0",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "httpx>=0.27",
  "tqdm>=4.66",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
rag-eval = "rag_juridique.eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_juridique"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
