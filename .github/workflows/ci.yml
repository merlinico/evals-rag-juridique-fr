name: ci

on:
  push:
    branches: [master, "cursor/**"]
  pull_request:
    branches: [master]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install project
        run: uv sync --extra dev

      - name: Unit tests
        run: uv run pytest -q

      - name: Regression eval (fixtures only)
        run: >
          uv run rag-eval
          --config configs/default.yaml
          --use-fixtures
          --check-baseline

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: reports/regression.md
